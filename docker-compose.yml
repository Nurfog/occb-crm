services:
  bd:
    image: postgres:18
    container_name: occb-bd
    environment:
      POSTGRES_USER: occb
      POSTGRES_PASSWORD: occb
      POSTGRES_DB: occb
    ports:
      - "5432:5432"
    volumes:
      - datos_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U occb -d occb"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  redis:
    image: redis:8
    container_name: occb-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - datos_redis:/data
  api:
    build:
      context: .
      dockerfile: ./crates/api/Dockerfile
    image: occb-api:local
    container_name: occb-api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://occb:occb@bd:5432/occb
      PUERTO_API: 3001
      RUST_LOG: info
      # Desarrollo: mismo secreto que los E2E y el mock LLM locales.
      APP_SECRETO: secreto-e2e-local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      bd:
        condition: service_healthy
  frontal:
    build:
      context: .
      dockerfile: ./crates/app/Dockerfile
    image: occb-frontal:local
    container_name: occb-frontal
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  datos_pg:
  datos_redis:
