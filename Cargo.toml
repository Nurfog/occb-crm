[package]
name = "occb-crm-frontend"
version = "0.1.0"
edition = "2021"
description = "Frontend Dioxus del CRM OCCB (solo frontend; el backend vive en el proyecto occb)"
license = "MIT OR Apache-2.0"

[dependencies]
dioxus = { version = "0.7", features = ["web", "router"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "js"] }
thiserror = "2"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
