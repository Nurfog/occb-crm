# Servidor del frontal OCCB: estáticos Dioxus + fallback SPA para el enrutador.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compresión de texto (el WASM ya viene optimizado).
  gzip on;
  gzip_types text/css application/javascript application/wasm text/html application/json;

  # Rutas del enrutador (/personas, /colegios, ...) → index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets versionados: caché larga.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
